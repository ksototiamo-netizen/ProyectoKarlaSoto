<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gremio de Aventureros</title>
        <link rel="stylesheet" href="../src/css/styles.css">
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <a href="#">
                    <img src="assets/logogi.png" alt="Logo">
                </a>
                <h1>Gremio de Aventureros</h1>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Encargos</a></li>
                    <li><a href="#">Hoyolab</a></li>
                </ul>
            </nav>
        </header>

        <img src="assets/logo.png" alt="Imagen principal" class="main-image">

        <main class="main-container">
            <section id="register" class="card-section">
                <h2>¡Ad Astra Abyssosque!</h2>
                <p>Registra a un nuevo aventurero en el gremio</p>
                
                <form id="form-traveler" class="form-register">
                    <div class="form-group">
                        <label for="name">Nombre del Aventurero</label>
                        <input type="text" id="name" placeholder="Ej. Aether, Lumine" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo/ Contacto</label>
                        <input type="email" id="email" placeholder="viajero@teyvat.com" required>
                    </div>

                    <button type="submit" class="btn-re">Registrar Aventurero</button>
                </form>
            </section>
            
            <section id="travelers" class="card-section">
                <h2>Registro Oficial de Viajeros</h2>
                <p>Consulta la lista de aventureros activos en Teyvant registrados actualmente</p>
                
                <button id="btn-cargar" class="btn-re" type="button">Obtener Aventureros</button>
                
                <div id="traveler-container" class="grid-traveler"></div>
            </section>
        </main>
        <script src="../src/js/app.js"></script>
    </body>
</html>
