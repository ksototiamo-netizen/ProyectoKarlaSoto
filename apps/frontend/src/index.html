<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gremio de Aventureros</title>
        <link rel="stylesheet" href="../src/css/styles.css">
    </head>
    <body>
        <header class="header">
            <div class="logo">
                <a href="#">
                    <img src="assets/logogi.png" alt="Logo">
                </a>
                <h1>Gremio de Aventureros</h1>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Encargos</a></li>
                    <li><a href="#">Hoyolab</a></li>
                </ul>
            </nav>
        </header>

        <img src="assets/logo.png" alt="Imagen principal" class="main-image">

        <main class="main-container">
            <section id="register" class="card-section">
                <h2>¡Ad Astra Abyssosque!</h2>
                <p>Registra a un nuevo aventurero en el gremio</p>
                
                <form id="form-traveler" class="form-register">
                    <div class="form-group">
                        <label for="name">Nombre del Aventurero</label>
                        <input type="text" id="name" placeholder="Ej. Aether, Lumine" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo/ Contacto</label>
                        <input type="email" id="email" placeholder="viajero@teyvat.com" required>
                    </div>

                    <div class="form-group">
                        <label for="vision">Visión Elemental</label>
                        <select id="vision" required>
                            <option value="Anemo">Anemo</option>
                            <option value="Geo">Geo</option>
                            <option value="Electro">Electro</option>
                            <option value="Pyro">Pyro</option>
                            <option value="Hydro">Hydro</option>
                            <option value="Cryo">Cryo</option>
                            <option value="Dendro">Dendro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="weapon">Arma Principal</label>
                        <select id="weapon" required>
                            <option value="Sword">Sword</option>
                            <option value="Claymore">Claymore</option>
                            <option value="Polearm">Polearm</option>
                            <option value="Catalyst">Catalyst</option>
                            <option value="Bow">Bow</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-re">Registrar Aventurero</button>
                </form>
            </section>
            
            <section id="travelers" class="card-section">
                <h2>Registro Oficial de Viajeros</h2>
                <p>Consulta la lista de aventureros activos en Teyvat registrados actualmente</p>

                <div class="search-container" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <input type="number" id="search-id" placeholder="Buscar por ID (Ej. 0)" style="padding: 0.6rem; border-radius: 4px; border: 1px solid #3b3f54; background: #121318; color: white; width: 100%; max-width: 200px;">
                    <button id="btn-buscar" class="btn-re" type="button" style="margin: 0;">Buscar ID</button>
                </div>
                
                <button id="btn-cargar" class="btn-re" type="button">Obtener Aventureros</button>
                
                <div id="traveler-container" class="grid-traveler"></div>
            </section>
        </main>
        <script src="../src/js/app.js"></script>
    </body>
</html>
